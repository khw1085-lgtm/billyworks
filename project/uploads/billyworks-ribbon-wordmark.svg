<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -24 850 220" role="img" aria-labelledby="title desc">
  <title id="title">billyworks ribbon wordmark</title>
  <desc id="desc">The lowercase word billyworks drawn as a colorful ribbon system.</desc>
  <style>
    #wordmark path {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw-ribbon 0.56s cubic-bezier(0.65, 0, 0.35, 1) var(--delay) forwards;
    }

    #wordmark [id^="ribbon-weave"] path {
      animation-duration: 0.3s;
    }

    #wordmark > g[id^="letter-"] {
      pointer-events: none;
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 620ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    #hit-areas rect {
      cursor: pointer;
      pointer-events: all;
    }

    #wordmark:has(#hit-b:hover) #letter-b { transform: translateY(-7px) rotate(-2deg) scale(1.04); }
    #wordmark:has(#hit-i:hover) #letter-i { transform: translateY(-9px) rotate(2deg) scale(1.05); }
    #wordmark:has(#hit-l-1:hover) #letter-l-1 { transform: translateY(-7px) rotate(-1.5deg) scaleY(1.04); }
    #wordmark:has(#hit-l-2:hover) #letter-l-2 { transform: translateY(-8px) rotate(1.5deg) scaleY(1.05); }
    #wordmark:has(#hit-y:hover) #letter-y { transform: translateY(-6px) rotate(1.5deg) scale(1.04); }
    #wordmark:has(#hit-w:hover) #letter-w { transform: translateY(-7px) scaleX(1.03) scaleY(1.06); }
    #wordmark:has(#hit-o:hover) #letter-o { transform: translateY(-7px) rotate(2deg) scale(1.04); }
    #wordmark:has(#hit-r:hover) #letter-r { transform: translateY(-9px) rotate(-2deg) scale(1.045); }
    #wordmark:has(#hit-k:hover) #letter-k { transform: translateY(-7px) rotate(2deg) scale(1.04); }
    #wordmark:has(#hit-s:hover) #letter-s { transform: translateY(-7px) rotate(-2deg) scale(1.04); }

    #wordmark:has(#hit-b:active) #letter-b,
    #wordmark:has(#hit-i:active) #letter-i,
    #wordmark:has(#hit-l-1:active) #letter-l-1,
    #wordmark:has(#hit-l-2:active) #letter-l-2,
    #wordmark:has(#hit-y:active) #letter-y,
    #wordmark:has(#hit-w:active) #letter-w,
    #wordmark:has(#hit-o:active) #letter-o,
    #wordmark:has(#hit-r:active) #letter-r,
    #wordmark:has(#hit-k:active) #letter-k,
    #wordmark:has(#hit-s:active) #letter-s {
      transform: translateY(1px) scale(0.98);
      transition-duration: 140ms;
    }

    @keyframes draw-ribbon {
      to { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      #wordmark path {
        animation: none;
        stroke-dashoffset: 0;
      }

      #wordmark > g[id^="letter-"] {
        transition: none;
      }
    }
  </style>
  <g id="wordmark" fill="none" stroke="#111111" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <g id="letter-b" stroke="#F05A28" style="--delay: 0s"><path pathLength="1" d="M24 22 C29 58 27 108 27 150 C30 111 45 82 68 80 C92 78 102 98 98 120 C94 142 78 153 59 151 C39 149 28 133 28 115" /></g>
    <g id="letter-i" stroke="#18A66A" style="--delay: 0.4s"><path pathLength="1" d="M132 84 C134 105 133 129 133 150" /><path pathLength="1" d="M132 43 C133 44 135 44 136 43" /></g>
    <g id="letter-l-1" stroke="#D3A21A" style="--delay: 0.8s"><path pathLength="1" d="M174 23 C180 62 177 111 178 150" /></g>
    <g id="letter-l-2" stroke="#8A73D9" style="--delay: 1.2s"><path pathLength="1" d="M216 23 C222 62 219 111 220 150" /></g>
    <g id="letter-y" stroke="#111111" style="--delay: 1.6s"><path pathLength="1" d="M255 84 C257 111 261 138 276 146 C292 141 301 111 303 84 C303 126 302 153 288 168" /></g>
    <g id="letter-w" stroke="#8A4F3D" style="--delay: 2s"><path pathLength="1" d="M340 84 C342 109 344 139 357 150 C371 141 375 112 378 91 C381 113 385 141 398 150 C413 140 417 108 419 84" /></g>
    <g id="letter-o" stroke="#2F6FED" style="--delay: 2.4s"><path pathLength="1" d="M479 79 C454 77 440 94 442 117 C444 140 458 152 479 152 C501 152 515 137 515 115 C515 92 502 79 479 79 Z" /></g>
    <g id="letter-r" stroke="#E95F3C" style="--delay: 2.8s"><path pathLength="1" d="M551 150 C553 127 552 105 551 84 C556 101 564 111 572 103 C581 94 588 80 603 81 C612 81 619 86 623 94" /></g>
    <g id="letter-k" stroke="#149B67" style="--delay: 3.2s"><path pathLength="1" d="M654 22 C660 61 657 111 658 150" /><path pathLength="1" d="M659 120 C677 111 691 96 701 82" /><path pathLength="1" d="M679 111 C688 124 699 138 713 150" /></g>
    <g id="letter-s" stroke="#7159C9" style="--delay: 3.6s"><path pathLength="1" d="M794 91 C783 78 758 77 744 88 C731 98 737 111 753 116 C771 121 791 121 796 134 C801 147 786 154 768 152 C752 151 740 146 733 138" /></g>
    <g id="ribbon-weave-1" stroke="#F0A61A" style="--delay: 0.32s"><path pathLength="1" d="M99 119 C110 115 118 109 130 105" /></g>
    <g id="ribbon-weave-2" stroke="#3F78D8" style="--delay: 1.9s"><path pathLength="1" d="M304 108 C316 102 327 100 339 106" /></g>
    <g id="ribbon-weave-3" stroke="#B56A32" style="--delay: 2.7s"><path pathLength="1" d="M516 108 C528 102 539 99 551 105" /></g>
    <g id="ribbon-weave-4" stroke="#D08A18" style="--delay: 3.5s"><path pathLength="1" d="M713 116 C721 111 727 108 736 109" /></g>
    <g id="hit-areas" fill="transparent" stroke="none">
      <rect id="hit-b" x="8" y="0" width="104" height="180" />
      <rect id="hit-i" x="112" y="20" width="48" height="150" />
      <rect id="hit-l-1" x="156" y="0" width="42" height="178" />
      <rect id="hit-l-2" x="198" y="0" width="42" height="178" />
      <rect id="hit-y" x="240" y="64" width="84" height="116" />
      <rect id="hit-w" x="324" y="64" width="110" height="110" />
      <rect id="hit-o" x="432" y="64" width="102" height="110" />
      <rect id="hit-r" x="534" y="64" width="102" height="110" />
      <rect id="hit-k" x="636" y="0" width="88" height="178" />
      <rect id="hit-s" x="724" y="64" width="92" height="110" />
    </g>
  </g>
</svg>
