<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Musinsa | Billyworks</title>
    <link rel="stylesheet" href="./cursor.css?v=5" />
    <style>
      :root {
        color: #fff;
        background: #000;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        overflow-x: hidden;
        background: #000;
      }

      .sub-page {
        display: flex;
        width: 100%;
        min-height: 100vh;
        padding: 80px 24px;
        flex-direction: column;
        align-items: center;
        gap: 100px;
        background: #000;
        opacity: 0;
        clip-path: inset(100% 0 0);
        transform: translate3d(0, 120px, 0);
        animation: subpage-rise 1200ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        will-change: opacity, clip-path, transform;
      }

      .parallax-layer {
        transform: translate3d(0, var(--parallax-y, 0px), 0);
        will-change: transform;
      }

      .sub-header {
        display: flex;
        width: min(1800px, 100%);
        padding-top: 50px;
        flex-direction: column;
        align-items: center;
        gap: 80px;
      }

      .close-button {
        display: grid;
        width: 44px;
        height: 44px;
        padding: 0;
        place-items: center;
        overflow: hidden;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #000;
        text-decoration: none;
        opacity: 1;
        transform: none;
        transition:
          background-color 180ms ease,
          transform 180ms ease;
      }

      .close-button:hover {
        background: #d9d9d9;
        transform: scale(1.08);
      }

      .close-button:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 5px;
      }

      .close-icon {
        display: block;
        width: 28px;
        height: 28px;
      }

      .case-logo {
        display: block;
        width: min(711.66px, 80vw);
        height: auto;
        opacity: 1;
      }

      .case-visual {
        width: min(1800px, 100%);
        height: min(1000px, 55.556vw);
        min-height: 320px;
        overflow: hidden;
        opacity: 1;
        transform: translate3d(0, var(--parallax-y, 0px), 0);
      }

      .case-visual img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }

      body.is-closing {
        overflow: hidden;
      }

      body.is-closing .sub-page {
        animation: subpage-fall 900ms cubic-bezier(0.7, 0, 0.84, 0) forwards;
        pointer-events: none;
      }

      @keyframes subpage-rise {
        to {
          opacity: 1;
          clip-path: inset(0 0 0);
          transform: translate3d(0, 0, 0);
        }
      }

      @keyframes subpage-fall {
        to {
          opacity: 0;
          clip-path: inset(100% 0 0);
          transform: translate3d(0, 120px, 0);
        }
      }

      @media (max-width: 720px) {
        .sub-page {
          padding: 44px 20px 64px;
          gap: 64px;
        }

        .sub-header {
          padding-top: 24px;
          gap: 52px;
        }

        .case-logo {
          width: min(80vw, 420px);
        }

        .case-visual {
          width: calc(100% + 40px);
          height: 62vw;
          min-height: 260px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .sub-page {
          opacity: 1;
          clip-path: none;
          transform: none;
          animation-duration: 1ms;
        }

        .parallax-layer {
          transform: none;
          will-change: auto;
        }

        body.is-closing .sub-page {
          animation-duration: 1ms;
        }
      }
    </style>
  </head>
  <body>
    <main class="sub-page" aria-label="Musinsa project">
      <header class="sub-header parallax-layer" data-parallax-speed="0.06">
        <a
          class="close-button"
          href="./billywork.html?skipIntro=1"
          aria-label="Close"
          data-cursor-label="CLOSE"
        >
          <img
            class="close-icon"
            src="./uploads/figma-sub-close.svg"
            alt=""
            width="28"
            height="28"
          />
        </a>
        <img
          class="case-logo"
          src="./uploads/figma-sub-musinsa-logo.svg"
          alt="MUSINSA"
          width="712"
          height="120"
        />
      </header>

      <div class="case-visual parallax-layer" data-parallax-speed="0.035">
        <img
          src="./uploads/figma-sub-musinsa-hero.png"
          alt="Musinsa mobile experience displayed in a minimal interior"
          width="1800"
          height="1000"
        />
      </div>
    </main>

    <script src="./cursor.js?v=5"></script>
    <script>
      const closeButton = document.querySelector(".close-button");
      const closeDuration = 900;
      let isClosing = false;

      closeButton.addEventListener("click", (event) => {
        event.preventDefault();
        if (isClosing) return;

        isClosing = true;
        sessionStorage.setItem("billyworksSkipIntro", "1");
        document.body.classList.add("is-closing");

        window.setTimeout(() => {
          const cameFromMain =
            document.referrer &&
            new URL(document.referrer).pathname.endsWith("/billywork.html");

          if (cameFromMain && window.history.length > 1) {
            window.history.back();
          } else {
            window.location.href = closeButton.href;
          }
        }, prefersReducedMotion ? 0 : closeDuration);
      });

      const prefersReducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;
      const parallaxLayers = [...document.querySelectorAll("[data-parallax-speed]")];
      let parallaxMetrics = [];
      let parallaxFrame = 0;

      const measureParallax = () => {
        parallaxLayers.forEach((layer) => {
          layer.style.setProperty("--parallax-y", "0px");
        });
        parallaxMetrics = parallaxLayers.map((layer) => {
          const rect = layer.getBoundingClientRect();
          return {
            layer,
            center: rect.top + window.scrollY + rect.height / 2,
            speed: Number(layer.dataset.parallaxSpeed),
          };
        });
      };

      const renderParallax = () => {
        parallaxFrame = 0;
        if (prefersReducedMotion) return;

        const viewportCenter = window.scrollY + window.innerHeight / 2;
        parallaxMetrics.forEach(({ layer, center, speed }) => {
          const offset = Math.max(
            -72,
            Math.min(72, (viewportCenter - center) * speed),
          );
          layer.style.setProperty("--parallax-y", `${offset.toFixed(2)}px`);
        });
      };

      const requestParallaxRender = () => {
        if (!parallaxFrame) parallaxFrame = requestAnimationFrame(renderParallax);
      };

      const refreshParallax = () => {
        if (prefersReducedMotion) return;
        measureParallax();
        renderParallax();
      };

      window.addEventListener("load", () => requestAnimationFrame(refreshParallax));
      window.addEventListener("scroll", requestParallaxRender, { passive: true });
      window.addEventListener("resize", refreshParallax);
    </script>
  </body>
</html>
