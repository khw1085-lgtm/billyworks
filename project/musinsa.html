<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Musinsa | Billyworks</title>
    <link rel="stylesheet" href="./cursor.css" />
    <style>
      :root {
        color: #fff;
        background: #000;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        overflow-x: hidden;
        background: #000;
      }

      .sub-page {
        display: flex;
        width: 100%;
        min-height: 100vh;
        padding: 80px 24px;
        flex-direction: column;
        align-items: center;
        gap: 100px;
        background: #000;
      }

      .sub-header {
        display: flex;
        width: min(1800px, 100%);
        padding-top: 50px;
        flex-direction: column;
        align-items: center;
        gap: 80px;
      }

      .close-button {
        display: grid;
        width: 44px;
        height: 44px;
        padding: 0;
        place-items: center;
        overflow: hidden;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #000;
        text-decoration: none;
        opacity: 0;
        transform: translateY(-36px);
        transition:
          background-color 180ms ease,
          transform 180ms ease;
        animation: close-enter 520ms cubic-bezier(0.16, 1, 0.3, 1) 120ms forwards;
      }

      .close-button:hover {
        background: #d9d9d9;
        transform: scale(1.08);
      }

      .close-button:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 5px;
      }

      .close-icon {
        display: block;
        width: 28px;
        height: 28px;
      }

      .case-logo {
        display: block;
        width: min(711.66px, 80vw);
        height: auto;
        opacity: 0;
        transform: translateY(24px);
        animation: content-enter 900ms cubic-bezier(0.16, 1, 0.3, 1) 260ms forwards;
      }

      .case-visual {
        width: min(1800px, 100%);
        height: min(1000px, 55.556vw);
        min-height: 320px;
        overflow: hidden;
        opacity: 0;
        transform: translateY(100px);
        animation: visual-enter 1100ms cubic-bezier(0.16, 1, 0.3, 1) 380ms forwards;
      }

      .case-visual img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }

      body.is-closing .close-button {
        animation: close-exit 420ms cubic-bezier(0.7, 0, 0.84, 0) forwards;
      }

      body.is-closing .case-logo {
        animation: content-exit 520ms ease forwards;
      }

      body.is-closing .case-visual {
        animation: visual-exit 620ms cubic-bezier(0.7, 0, 0.84, 0) forwards;
      }

      @keyframes close-enter {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes content-enter {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes visual-enter {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes close-exit {
        to {
          opacity: 0;
          transform: translateY(-36px);
        }
      }

      @keyframes content-exit {
        to {
          opacity: 0;
          transform: translateY(24px);
        }
      }

      @keyframes visual-exit {
        to {
          opacity: 0;
          transform: translateY(100px);
        }
      }

      @media (max-width: 720px) {
        .sub-page {
          padding: 44px 20px 64px;
          gap: 64px;
        }

        .sub-header {
          padding-top: 24px;
          gap: 52px;
        }

        .case-logo {
          width: min(80vw, 420px);
        }

        .case-visual {
          width: calc(100% + 40px);
          height: 62vw;
          min-height: 260px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .close-button,
        .case-logo,
        .case-visual,
        body.is-closing .close-button,
        body.is-closing .case-logo,
        body.is-closing .case-visual {
          opacity: 1;
          transform: none;
          animation-duration: 1ms;
        }
      }
    </style>
  </head>
  <body>
    <main class="sub-page" aria-label="Musinsa project">
      <header class="sub-header">
        <a class="close-button" href="./billywork.html?skipIntro=1" aria-label="Close">
          <img
            class="close-icon"
            src="./uploads/figma-sub-close.svg"
            alt=""
            width="28"
            height="28"
          />
        </a>
        <img
          class="case-logo"
          src="./uploads/figma-sub-musinsa-logo.svg"
          alt="MUSINSA"
          width="712"
          height="120"
        />
      </header>

      <div class="case-visual">
        <img
          src="./uploads/figma-sub-musinsa-hero.png"
          alt="Musinsa mobile experience displayed in a minimal interior"
          width="1800"
          height="1000"
        />
      </div>
    </main>

    <script src="./cursor.js?v=2"></script>
    <script>
      const closeButton = document.querySelector(".close-button");

      closeButton.addEventListener("click", (event) => {
        event.preventDefault();
        sessionStorage.setItem("billyworksSkipIntro", "1");
        document.body.classList.add("is-closing");
        window.setTimeout(() => {
          window.location.href = closeButton.href;
        }, 640);
      });
    </script>
  </body>
</html>
