<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>musinsa | billyworks</title>
    <style>
      :root {
        color: #000;
        background: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #fff;
      }

      .sub-page {
        position: relative;
        width: min(100vw, 2316px);
        min-height: max(100vh, 2536px);
        margin: 0 auto;
        padding: 52px clamp(24px, 11.14vw, 258px) 160px;
        overflow: hidden;
      }

      .close-button {
        position: fixed;
        top: 50px;
        left: 50%;
        z-index: 5;
        display: grid;
        width: 56px;
        height: 56px;
        place-items: center;
        border: 1px solid #000;
        border-radius: 50%;
        background: #000;
        color: #fff;
        text-decoration: none;
        opacity: 0;
        transform: translate(-50%, -84px);
        transition: background-color 180ms ease, color 180ms ease;
        animation: close-drop 420ms cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
      }

      .close-button:hover {
        background: #fff;
        color: #000;
      }

      .close-button::before,
      .close-button::after {
        position: absolute;
        width: 20px;
        height: 2px;
        border-radius: 999px;
        background: currentColor;
        content: "";
      }

      .close-button::before {
        transform: rotate(45deg);
      }

      .close-button::after {
        transform: rotate(-45deg);
      }

      .close-button:focus-visible {
        outline: 3px solid #7b7b7b;
        outline-offset: 4px;
      }

      .case-title {
        width: fit-content;
        margin: 146px auto 0;
        font-size: clamp(92px, 10.1vw, 234px);
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0;
        text-align: center;
        opacity: 0;
        animation: fade-title 1.5s ease 0.78s forwards;
      }

      .case-frame {
        width: min(100%, 1008px);
        aspect-ratio: 1 / 1;
        margin: 96px auto 0;
        border: 1px solid #7b7b7b;
        background: #fff;
        opacity: 0;
        transform: translateY(180px);
        animation: frame-rise 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.78s forwards;
      }

      body.is-closing .close-button {
        animation: close-exit 480ms cubic-bezier(0.7, 0, 0.84, 0) forwards;
      }

      body.is-closing .case-title {
        animation: title-exit 620ms ease forwards;
      }

      body.is-closing .case-frame {
        animation: frame-exit 720ms cubic-bezier(0.7, 0, 0.84, 0) forwards;
      }

      @keyframes close-drop {
        0% {
          opacity: 0;
          transform: translate(-50%, -84px);
        }

        100% {
          opacity: 1;
          transform: translate(-50%, 0);
        }
      }

      @keyframes close-exit {
        0% {
          opacity: 1;
          transform: translate(-50%, 0);
        }

        100% {
          opacity: 0;
          transform: translate(-50%, -84px);
        }
      }

      @keyframes fade-title {
        0% {
          opacity: 0;
          transform: translateY(18px);
        }

        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes title-exit {
        0% {
          opacity: 1;
          transform: translateY(0);
        }

        100% {
          opacity: 0;
          transform: translateY(28px);
        }
      }

      @keyframes frame-rise {
        0% {
          opacity: 0;
          transform: translateY(180px);
        }

        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes frame-exit {
        0% {
          opacity: 1;
          transform: translateY(0);
        }

        100% {
          opacity: 0;
          transform: translateY(180px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .close-button,
        .case-title,
        .case-frame {
          animation-duration: 1ms;
        }
      }

      @media (max-width: 720px) {
        .sub-page {
          min-height: max(100vh, 980px);
          padding: 52px 20px 72px;
        }

        .close-button {
          width: 44px;
          height: 44px;
        }

        .close-button::before,
        .close-button::after {
          width: 16px;
        }

        .case-title {
          margin-top: 124px;
          font-size: clamp(58px, 18vw, 100px);
          overflow-wrap: anywhere;
        }

        .case-frame {
          width: min(100%, 640px);
          margin-top: 54px;
        }
      }
    </style>
  </head>
  <body>
    <main class="sub-page" aria-label="Musinsa project">
      <a class="close-button" href="./billywork.html?skipIntro=1" aria-label="Close"></a>
      <h1 class="case-title">MUSINSA</h1>
      <div class="case-frame" aria-hidden="true"></div>
    </main>
    <script>
      const closeButton = document.querySelector(".close-button");

      closeButton.addEventListener("click", (event) => {
        event.preventDefault();
        document.body.classList.add("is-closing");
        window.setTimeout(() => {
          window.location.href = closeButton.href;
        }, 760);
      });
    </script>
  </body>
</html>
