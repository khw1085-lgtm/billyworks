<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>billyworks loading transition</title>
    <link rel="stylesheet" href="./cursor.css" />
    <style>
      :root {
        color: #000;
        background: #000;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }

      .screen {
        position: fixed;
        inset: 0;
        display: grid;
        min-height: 100vh;
        place-items: center;
      }

      .loading-screen {
        z-index: 1;
        background: #000;
        color: #fff;
        opacity: 1;
        visibility: visible;
      }

      .design-frame {
        width: min(100vw, 2316px);
        min-height: 100vh;
        margin: auto;
      }

      .loading-frame {
        display: grid;
        place-items: center;
      }

      .loading-title {
        margin: 0;
        display: flex;
        gap: 12px;
        min-height: 36px;
        font-size: 30px;
        font-weight: 400;
        line-height: 1.2;
        text-align: center;
      }

      .loading-word {
        position: relative;
        display: inline-block;
        min-width: var(--word-width);
        text-align: left;
      }

      .loading-word.is-typing::after {
        display: inline-block;
        width: 1px;
        height: 0.9em;
        margin-left: 3px;
        background: currentColor;
        vertical-align: -0.1em;
        animation: caret-blink 760ms step-end infinite;
        content: "";
      }

      .main-screen {
        display: block;
        z-index: 2;
        background: #fff;
        color: #000;
        clip-path: ellipse(0 0 at 50% 52%);
        opacity: 1;
        visibility: visible;
        will-change: clip-path;
      }

      .main-content {
        width: min(100vw, 2316px);
        min-height: max(100vh, 2536px);
        padding: 0 clamp(24px, 11.14vw, 258px) 140px;
      }

      .hero-title {
        margin: 0;
        font-size: clamp(80px, 8.59vw, 199px);
        font-weight: 800;
        line-height: 1.21;
        letter-spacing: 0;
      }

      .intro {
        width: min(462px, 100%);
        margin: 40px 0 0;
        color: #000;
        font-size: 16px;
        font-weight: 200;
        line-height: 1.21;
      }

      .work-grid {
        display: grid;
        width: calc(100% + 2px);
        margin: 60px -1px 0;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        border: 1px solid #7b7b7b;
        background: #000;
        opacity: 1;
        transform: translateY(0);
      }

      .work-tile {
        position: relative;
        aspect-ratio: 599.333 / 723.5;
        min-height: 0;
        overflow: hidden;
        border: 0;
        border-right: 1px solid #7b7b7b;
        border-bottom: 1px solid #7b7b7b;
        border-radius: 0;
        background: #fff;
        transition: background-color 240ms ease, border-radius 320ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .work-tile:first-child {
        background: #000;
      }

      .work-thumbnail {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }

      .work-tile:hover {
        z-index: 1;
        background: #d9d9d9;
        border-radius: 60px;
      }

      .work-tile:nth-child(3n) {
        border-right: 0;
      }

      .work-tile:nth-last-child(-n + 3) {
        border-bottom: 0;
      }

      .work-tile:focus-visible {
        outline: 4px solid #777;
        outline-offset: -10px;
      }

      body.is-loaded,
      body.is-revealing {
        overflow: auto;
        background: #fff;
      }

      body.is-loaded .loading-screen {
        display: none;
        opacity: 0;
        visibility: hidden;
      }

      body.is-revealing .main-screen {
        animation: squashed-reveal 3000ms cubic-bezier(0.74, -0.02, 0.18, 1.02)
          forwards;
      }

      body.is-loaded .main-screen {
        animation: none;
        clip-path: inset(0);
        position: relative;
        min-height: 100vh;
      }

      body.is-skip-intro .work-grid {
        animation: none;
        opacity: 1;
        transform: translateY(0);
      }

      body.is-skip-intro .main-content {
        opacity: 0;
        animation: main-return-fade 720ms ease forwards;
      }

      @keyframes caret-blink {
        50% {
          opacity: 0;
        }
      }

      @keyframes squashed-reveal {
        0% {
          clip-path: ellipse(0 0 at 50% 52%);
        }

        68% {
          clip-path: ellipse(156vmax 116vmax at 50% 52%);
        }

        84% {
          clip-path: ellipse(132vmax 98vmax at 50% 52%);
        }

        100% {
          clip-path: ellipse(146vmax 108vmax at 50% 52%);
        }
      }

      @keyframes main-return-fade {
        0% {
          opacity: 0;
        }

        100% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body.is-revealing .main-screen {
          animation-duration: 1ms;
        }
      }

      @media (max-width: 720px) {
        .main-content {
          min-height: max(100vh, 980px);
          padding: 0 20px 64px;
        }

        .hero-title {
          font-size: clamp(56px, 18vw, 96px);
          line-height: 1;
          overflow-wrap: anywhere;
        }

        .intro {
          margin-top: 28px;
          font-size: 14px;
          line-height: 1.25;
        }

        .work-grid {
          margin-top: 42px;
          grid-template-columns: 1fr;
        }

        .work-tile {
          aspect-ratio: 592 / 320;
          border-right: 0;
          border-bottom: 1px solid #7b7b7b;
        }

        .work-tile:nth-last-child(-n + 3) {
          border-bottom: 1px solid #7b7b7b;
        }

        .work-tile:last-child {
          border-bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <section class="screen loading-screen" aria-label="Loading">
      <div class="design-frame loading-frame">
        <h1 class="loading-title" aria-label="BILLY WORKS">
          <span class="loading-word" data-text="BILLY" style="--word-width: 5ch"></span>
          <span class="loading-word" data-text="WORKS" style="--word-width: 5.5ch"></span>
        </h1>
      </div>
    </section>

    <main class="screen main-screen" aria-label="Billyworks introduction">
      <div class="design-frame main-content">
        <h1 class="hero-title">BILLY WORKS</h1>
        <p class="intro">
          Silvia Vargas is a Spanish artist and illustrator who brings fantasy and horror
          to life through bold character designs and surreal, emotionally rich landscapes,
          blending reality with imagination through vibrant colors and dynamic storytelling.
        </p>
        <section class="work-grid" aria-label="Featured work">
          <a class="work-tile" href="./musinsa.html" aria-label="Open featured work 1">
            <img class="work-thumbnail" src="./uploads/musinsa-thumbnail.png" alt="" />
          </a>
          <a class="work-tile" href="./musinsa.html" aria-label="Open featured work 2"></a>
          <a class="work-tile" href="./musinsa.html" aria-label="Open featured work 3"></a>
          <a class="work-tile" href="./musinsa.html" aria-label="Open featured work 4"></a>
          <a class="work-tile" href="./musinsa.html" aria-label="Open featured work 5"></a>
          <a class="work-tile" href="./musinsa.html" aria-label="Open featured work 6"></a>
        </section>
      </div>
    </main>

    <script src="./cursor.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const skipIntroKey = "billyworksSkipIntro";
      const shouldSkipIntro =
        params.get("skipIntro") === "1" || sessionStorage.getItem(skipIntroKey) === "1";
      const workLinks = document.querySelectorAll(".work-tile");
      const prefersReducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;

      workLinks.forEach((link) => {
        link.addEventListener("click", () => {
          sessionStorage.setItem(skipIntroKey, "1");
        });
      });

      const typeLoadingTitle = async () => {
        if (shouldSkipIntro || prefersReducedMotion) {
          document.querySelectorAll(".loading-word").forEach((word) => {
            word.textContent = word.dataset.text;
          });
          return;
        }

        for (const word of document.querySelectorAll(".loading-word")) {
          const text = word.dataset.text;
          word.classList.add("is-typing");

          for (let index = 0; index <= text.length; index += 1) {
            word.textContent = text.slice(0, index);
            await new Promise((resolve) => window.setTimeout(resolve, 96));
          }

          await new Promise((resolve) => window.setTimeout(resolve, 180));
          word.classList.remove("is-typing");
        }
      };

      if (shouldSkipIntro) {
        document.body.classList.add("is-loaded", "is-skip-intro");
        sessionStorage.removeItem(skipIntroKey);
        window.history.replaceState(null, "", window.location.pathname);
      } else {
        typeLoadingTitle().then(() => {
          document.body.classList.add("is-revealing");

          window.setTimeout(() => {
            document.body.classList.add("is-loaded");
            document.body.classList.remove("is-revealing");
          }, 3000);
        });
      }
    </script>
  </body>
</html>
