<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hyunwoopf loading transition</title>
    <style>
      :root {
        color: #000;
        background: #000;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }

      .screen {
        position: fixed;
        inset: 0;
        display: grid;
        min-height: 100vh;
        place-items: center;
      }

      .loading-screen {
        z-index: 1;
        background: #000;
        color: #fff;
        opacity: 1;
        visibility: visible;
      }

      .design-frame {
        width: min(100vw, 2316px);
        min-height: 100vh;
        margin: auto;
      }

      .loading-frame {
        display: grid;
        place-items: center;
      }

      .loading-title {
        margin: 0;
        font-size: 30px;
        font-weight: 400;
        line-height: 1.2;
        text-align: center;
      }

      .main-screen {
        display: block;
        z-index: 2;
        background: #fff;
        color: #000;
        clip-path: ellipse(0 0 at 50% 52%);
        opacity: 1;
        visibility: visible;
        will-change: clip-path;
      }

      .main-content {
        width: min(100vw, 2316px);
        min-height: max(100vh, 2536px);
        padding: 0 clamp(24px, 11.14vw, 258px) 140px;
      }

      .hero-title {
        margin: 0;
        font-size: clamp(80px, 9.67vw, 224px);
        font-weight: 900;
        line-height: 1.08;
        letter-spacing: 0;
      }

      .intro {
        width: min(462px, 100%);
        margin: 40px 0 0;
        color: #777;
        font-size: 16px;
        font-weight: 400;
        line-height: 1.18;
      }

      .work-grid {
        display: grid;
        width: min(100%, 1824px);
        margin: 64px auto 0;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        border: 1px solid #7b7b7b;
        background: #000;
      }

      .work-tile {
        position: relative;
        aspect-ratio: 592 / 501;
        min-height: 0;
        border: 0;
        border-right: 1px solid #7b7b7b;
        border-bottom: 1px solid #7b7b7b;
        border-radius: 0;
        background: #fff;
        transition: background-color 240ms ease, border-radius 320ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .work-tile:hover {
        z-index: 1;
        background: #d9d9d9;
        border-radius: 60px;
      }

      .work-tile:nth-child(3n) {
        border-right: 0;
      }

      .work-tile:nth-last-child(-n + 3) {
        border-bottom: 0;
      }

      .work-tile:focus-visible {
        outline: 4px solid #777;
        outline-offset: -10px;
      }

      body.is-loaded,
      body.is-revealing {
        overflow: auto;
        background: #fff;
      }

      body.is-loaded .loading-screen {
        display: none;
        opacity: 0;
        visibility: hidden;
      }

      body.is-revealing .main-screen {
        animation: squashed-reveal 3000ms cubic-bezier(0.74, -0.02, 0.18, 1.02)
          forwards;
      }

      body.is-loaded .main-screen {
        animation: none;
        clip-path: inset(0);
        position: relative;
        min-height: 100vh;
      }

      @keyframes squashed-reveal {
        0% {
          clip-path: ellipse(0 0 at 50% 52%);
        }

        68% {
          clip-path: ellipse(156vmax 116vmax at 50% 52%);
        }

        84% {
          clip-path: ellipse(132vmax 98vmax at 50% 52%);
        }

        100% {
          clip-path: ellipse(146vmax 108vmax at 50% 52%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body.is-revealing .main-screen {
          animation-duration: 1ms;
        }
      }

      @media (max-width: 720px) {
        .main-content {
          min-height: max(100vh, 980px);
          padding: 0 20px 64px;
        }

        .hero-title {
          font-size: clamp(56px, 18vw, 96px);
          line-height: 1;
          overflow-wrap: anywhere;
        }

        .intro {
          margin-top: 28px;
          font-size: 14px;
          line-height: 1.25;
        }

        .work-grid {
          margin-top: 42px;
          grid-template-columns: 1fr;
        }

        .work-tile {
          aspect-ratio: 592 / 320;
          border-right: 0;
          border-bottom: 1px solid #7b7b7b;
        }

        .work-tile:nth-last-child(-n + 3) {
          border-bottom: 1px solid #7b7b7b;
        }

        .work-tile:last-child {
          border-bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <section class="screen loading-screen" aria-label="Loading">
      <div class="design-frame loading-frame">
        <h1 class="loading-title">BILLY WORK</h1>
      </div>
    </section>

    <main class="screen main-screen" aria-label="Billy work introduction">
      <div class="design-frame main-content">
        <h1 class="hero-title">BILLY WORK</h1>
        <p class="intro">
          Silvia Vargas is a Spanish artist and illustrator who brings fantasy and horror
          to life through bold character designs and surreal, emotionally rich landscapes,
          blending reality with imagination through vibrant colors and dynamic storytelling.
        </p>
        <section class="work-grid" aria-label="Featured work">
          <button class="work-tile" type="button" aria-label="Featured work 1"></button>
          <button class="work-tile" type="button" aria-label="Featured work 2"></button>
          <button class="work-tile" type="button" aria-label="Featured work 3"></button>
          <button class="work-tile" type="button" aria-label="Featured work 4"></button>
          <button class="work-tile" type="button" aria-label="Featured work 5"></button>
          <button class="work-tile" type="button" aria-label="Featured work 6"></button>
        </section>
      </div>
    </main>

    <script>
      window.setTimeout(() => {
        document.body.classList.add("is-revealing");
      }, 3000);

      window.setTimeout(() => {
        document.body.classList.add("is-loaded");
        document.body.classList.remove("is-revealing");
      }, 6200);
    </script>
  </body>
</html>
